name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint, and contract checks (Elixir ${{ matrix.elixir-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir-version: "1.19.4"
            otp-version: "28.0"
          - elixir-version: "1.20.1"
            otp-version: "29.0"

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: hawk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      HAWK_DATABASE_URL: postgres://postgres@localhost:5432/hawk_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp-version }}
          elixir-version: ${{ matrix.elixir-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache Mix deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ matrix.elixir-version }}-otp-${{ matrix.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir-version }}-otp-${{ matrix.otp-version }}-

      - name: Install Mix dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile dependencies
        run: |
          mkdir -p tmp
          if ! mix deps.compile 2> tmp/deps-compile.stderr; then
            cat tmp/deps-compile.stderr >&2
            exit 1
          fi

      - name: Compile application
        run: mix compile --warnings-as-errors --no-deps-check

      - name: Setup test database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Test with coverage
        run: mix test --cover

      - name: Credo
        run: mix credo

      - name: Dialyzer
        run: mix dialyzer

      - name: Generate OpenAPI spec from discovered Hawk resources
        run: |
          mkdir -p tmp/openapi
          mix hawk.openapi -o tmp/openapi/openapi.json \
            --title "Videdal API" \
            --version "1.0.0" \
            --license "Videdal Test Application License" \
            --license-url "https://example.com/licenses/videdal"

      - name: Validate OpenAPI spec
        run: npm exec --yes --package=@redocly/cli -- redocly lint tmp/openapi/openapi.json

      - name: Verify frontend TypeScript generation from OpenAPI
        run: |
          npm exec --yes --package=openapi-typescript -- openapi-typescript tmp/openapi/openapi.json -o tmp/openapi/types.d.ts
          test -s tmp/openapi/types.d.ts

      - name: Upload generated API artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: openapi-contract
          path: |
            tmp/openapi/openapi.json
            tmp/openapi/types.d.ts
          if-no-files-found: ignore

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest

    env:
      MIX_ENV: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.1"

      - name: Cache Mix deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-docs-elixir-1.20.1-otp-29.0-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-docs-elixir-1.20.1-otp-29.0-

      - name: Install Mix dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile dependencies
        run: |
          mkdir -p tmp
          if ! mix deps.compile 2> tmp/deps-compile.stderr; then
            cat tmp/deps-compile.stderr >&2
            exit 1
          fi

      - name: Compile application
        run: mix compile --warnings-as-errors --no-deps-check

      - name: Generate docs with warnings as errors
        run: mix docs --warnings-as-errors
